<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cube Game — Split Screen Competition</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#03050a; font-family:Arial, sans-serif; }
  .arena { position:relative; width:100%; height:100%; display:flex; background:#03050a; }
  .player { position:relative; width:50%; height:100%; overflow:hidden; background:#05070d; }
  .player iframe { display:block; width:100%; height:100%; border:0; }
  .divider { position:absolute; z-index:50; left:50%; top:0; width:3px; height:100%; transform:translateX(-50%);
             background:rgba(255,255,255,.75); box-shadow:0 0 18px rgba(90,220,255,.9); pointer-events:none; }
  .label { position:absolute; z-index:60; top:12px; padding:7px 14px; border-radius:999px;
           color:#fff; background:rgba(0,0,0,.62); border:1px solid rgba(255,255,255,.18);
           font-weight:900; letter-spacing:.12em; font-size:13px; pointer-events:none; }
  .label.left { left:14px; } .label.right { right:14px; }
  .rules { position:absolute; z-index:70; left:50%; top:12px; transform:translateX(-50%);
           padding:8px 14px; border-radius:10px; color:#fff; background:rgba(0,0,0,.72);
           border:1px solid rgba(255,255,255,.18); font-size:11px; font-weight:700;
           text-align:center; pointer-events:none; white-space:nowrap; }
  .result { position:absolute; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
            background:rgba(0,0,0,.86); color:#fff; text-align:center; }
  .result.show { display:flex; }
  .card { min-width:300px; max-width:90vw; padding:30px; border-radius:18px; background:#0a0f1b;
          border:1px solid rgba(255,255,255,.18); box-shadow:0 20px 80px rgba(0,0,0,.7); }
  .title { font-size:34px; font-weight:1000; margin-bottom:10px; }
  .detail { opacity:.75; margin-bottom:22px; }
  button { border:0; border-radius:10px; padding:12px 20px; cursor:pointer; font-weight:900; }
  .again { background:#fff; color:#05070d; }
  .menu { margin-left:8px; background:#202738; color:#fff; }
  @media (max-width:700px) {
    .rules { font-size:9px; padding:6px 8px; top:8px; }
    .label { font-size:10px; top:42px; }
  }
</style>
</head>
<body>
<div class="arena">
  <section class="player">
    <div class="label left">PLAYER 1</div>
    <iframe id="p1" src="./index.html?competitionChild=1&player=1" title="Player 1"></iframe>
  </section>
  <section class="player">
    <div class="label right">PLAYER 2</div>
    <iframe id="p2" src="./index.html?competitionChild=1&player=2" title="Player 2"></iframe>
  </section>
  <div class="divider"></div>
  <div class="rules">🟦 DESTROY GOOD CUBES &nbsp; • &nbsp; 💣 NEVER HIT BOMBS &nbsp; • &nbsp; MISS A GOOD CUBE = LOSE</div>
</div>

<div class="result" id="result">
  <div class="card">
    <div class="title" id="resultTitle">MATCH OVER</div>
    <div class="detail" id="resultDetail"></div>
    <button class="again" onclick="location.reload()">PLAY AGAIN</button>
    <button class="menu" onclick="location.href='./index.html'">MENU</button>
  </div>
</div>

<script>
(() => {
  const ended = new Map();
  let finished = false;

  window.addEventListener("message", (event) => {
    if (event.origin !== location.origin) return;
    const d = event.data || {};
    if (d.source !== "cube-game-competition") return;

    if (d.type === "end") {
      ended.set(Number(d.player), { reason:d.reason || "missed", score:Number(d.score) || 0 });
      if (finished) return;
      finished = true;

      const loser = Number(d.player);
      const winner = loser === 1 ? 2 : 1;
      const title = document.getElementById("resultTitle");
      const detail = document.getElementById("resultDetail");

      title.textContent = "PLAYER " + winner + " WINS! 🏆";
      detail.textContent =
        "Player " + loser + " lost by " +
        (d.reason === "bomb" ? "destroying a bomb 💣" : "missing a good cube 🟦") +
        ".";
      document.getElementById("result").classList.add("show");
    }
  });
})();
</script>
</body>
</html>
