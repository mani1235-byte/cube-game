name: Build Android Tablet App

on:
  workflow_dispatch:

jobs:
  build-android-tablet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor dependencies
        working-directory: "mobile app and tablet app"
        run: npm install

      - name: Sync Capacitor Android project
        working-directory: "mobile app and tablet app"
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android Tablet APK
        working-directory: "mobile app and tablet app/android"
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename Tablet APK
        run: |
          cp "mobile app and tablet app/android/app/build/outputs/apk/debug/app-debug.apk" \
             "mobile app and tablet app/android/app/build/outputs/apk/debug/Cube-Game-Android-Tablet.apk"

      - name: Upload Tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: Cube-Game-Android-Tablet
          path: "mobile app and tablet app/android/app/build/outputs/apk/debug/Cube-Game-Android-Tablet.apk"
