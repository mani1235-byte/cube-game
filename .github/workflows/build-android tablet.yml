name: Build Android App

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "mobile app and tablet app/package-lock.json"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: "mobile app and tablet app"
        run: npm ci

      - name: Sync Capacitor Android
        working-directory: "mobile app and tablet app"
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android APK
        working-directory: "mobile app and tablet app/android"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Cube-Game-Android-Tablet
          path: "mobile app and tablet app/android/app/build/outputs/apk/debug/app-debug.apk"
